<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vakansiya — Work.uz</title>
<meta name="description" content="Work.uz platformasidagi vakansiya tafsilotlari.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B1220; --blue:#3D5AFE; --blue-2:#6C8CFF; --blue-soft:#EAEFFF; --amber:#FFB020; --amber-2:#FFCE73;
    --bg:#F5F7FC; --card:#FFFFFF; --text:#1A2240; --muted:#64708A; --line:#E3E8F5;
    --shadow-sm: 0 2px 8px rgba(20,30,70,.06); --shadow-md: 0 12px 30px rgba(20,30,70,.10); --shadow-lg: 0 30px 60px rgba(15,22,50,.18);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:'Sora',sans-serif;}
  a{color:inherit;text-decoration:none;}
  .wrap{max-width:760px;margin:0 auto;padding:0 20px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 24px;border-radius:12px;font-weight:600;font-size:14.5px;border:none;cursor:pointer;transition:.18s;}
  .btn-primary{background:var(--blue);color:#fff;box-shadow:0 10px 24px rgba(61,90,254,.32);}
  .btn-primary:hover{transform:translateY(-2px);}
  .btn-primary:disabled{opacity:.55;cursor:default;transform:none;}
  .btn-ghost{background:#fff;color:var(--text);border:1px solid var(--line);}
  .btn-ghost:hover{border-color:var(--blue);color:var(--blue);}

  header{background:var(--ink);padding:18px 0;}
  header .wrap{display:flex;align-items:center;justify-content:space-between;}
  .logo{display:flex;align-items:center;gap:8px;color:#fff;font-family:'Sora';font-weight:800;font-size:18px;}
  .logo span{color:var(--amber-2);}

  main{padding:40px 0 80px;}
  .back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13.5px;margin-bottom:20px;}
  .back:hover{color:var(--blue);}

  .card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:36px;box-shadow:var(--shadow-sm);}
  .top-row{display:flex;gap:16px;align-items:flex-start;margin-bottom:22px;}
  .logo-badge{width:56px;height:56px;border-radius:14px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Sora';font-weight:800;font-size:20px;}
  h1{font-size:26px;line-height:1.2;margin-bottom:6px;}
  .company-line{color:var(--muted);font-size:14.5px;}
  .badge-new{display:inline-block;font-size:11px;font-weight:700;background:rgba(255,176,32,.15);color:#B9720A;padding:4px 10px;border-radius:100px;margin-bottom:8px;}

  .meta-row{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0;}
  .meta-pill{font-size:13px;font-weight:600;background:var(--blue-soft);color:var(--blue);padding:8px 14px;border-radius:100px;}
  .salary-box{
    font-family:'JetBrains Mono',monospace;font-weight:700;font-size:19px;color:var(--ink);
    background:#FAFBFF;border:1px solid var(--line);border-radius:12px;padding:16px 20px;margin:20px 0;
  }
  .desc{white-space:pre-wrap;line-height:1.7;font-size:14.5px;color:var(--text);margin:20px 0;}
  .desc.empty{color:var(--muted);font-style:italic;}

  .apply-box{border-top:1px solid var(--line);margin-top:26px;padding-top:26px;}
  .file-row{display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap;}
  .file-row input[type=file]{font-size:13px;}
  .actions-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px;}
  .status-msg{font-size:13px;color:var(--muted);margin-top:10px;}
  .status-msg.ok{color:#0FA968;font-weight:600;}
  .status-msg.err{color:#D14343;font-weight:600;}

  .closed-box{background:#FDECEC;border:1px solid #F6C7C7;color:#B23A3A;padding:16px 20px;border-radius:12px;font-size:14px;font-weight:600;margin-top:20px;}
  .loading, .notfound{text-align:center;padding:80px 20px;color:var(--muted);}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <a href="/" class="logo">Work<span>.uz</span></a>
  </div>
</header>

<main>
  <div class="wrap">
    <a href="/" class="back">← Barcha vakansiyalarga qaytish</a>
    <div id="content" class="loading">Yuklanmoqda...</div>
  </div>
</main>

<script>
  const API_TOKEN_KEY = 'work_uz_token';
  let token = localStorage.getItem(API_TOKEN_KEY) || null;
  const id = location.pathname.split('/').filter(Boolean).pop();

  function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s==null?'':String(s); return d.innerHTML; }
  const PALETTE = ['#3D5AFE','#FFB020','#22C598','#7B5CFA','#EE5B5B','#00B4D8'];
  function colorFor(seed){ let h=0; for(const c of String(seed)) h=(h*31+c.charCodeAt(0))>>>0; return PALETTE[h%PALETTE.length]; }
  function initials(name){ return (name||'??').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase().slice(0,2)||'??'; }

  async function api(path, opts){
    opts = opts || {};
    const headers = Object.assign({}, opts.headers||{});
    if(token) headers['Authorization'] = 'Bearer ' + token;
    if(!(opts.body instanceof FormData)) headers['Content-Type'] = 'application/json';
    const res = await fetch(path, Object.assign({}, opts, {headers}));
    let data = null;
    try{ data = await res.json(); }catch(e){}
    if(!res.ok) throw new Error((data && data.error) || 'Xatolik');
    return data;
  }

  async function load(){
    const content = document.getElementById('content');
    try{
      const data = await api('/api/vacancies/' + id);
      const v = data.vacancy;
      document.title = `${v.title} — ${v.company} | Work.uz`;
      const color = colorFor(v.company + v.title);

      let applied = false;
      if(token){
        try{
          const mine = await api('/api/applications/mine');
          applied = mine.ids.includes(v.id);
        }catch(e){}
      }

      content.className = '';
      content.innerHTML = `
        <div class="card">
          ${!v.is_sample ? "<span class=\"badge-new\">YANGI E'LON</span><br>" : ''}
          <div class="top-row">
            <div class="logo-badge" style="background:${color};">${initials(v.company)}</div>
            <div>
              <h1>${escapeHtml(v.title)}</h1>
              <div class="company-line">🏢 ${escapeHtml(v.company)} &nbsp;·&nbsp; 📍 ${escapeHtml(v.city)}</div>
            </div>
          </div>
          <div class="meta-row">
            <span class="meta-pill">${escapeHtml(v.type)}</span>
            <span class="meta-pill">👥 ${v.applicant_count || 0} ta ariza</span>
          </div>
          <div class="salary-box">${escapeHtml(v.salary || "Maosh: kelishilgan holda")}</div>
          <div class="desc ${v.description ? '' : 'empty'}">${v.description ? escapeHtml(v.description) : "Bu vakansiya uchun batafsil tavsif kiritilmagan."}</div>

          ${v.status !== 'open' ? `<div class="closed-box">Bu lavozim allaqachon yopilgan — endi ariza qabul qilinmaydi.</div>` : `
          <div class="apply-box">
            <h3 style="font-size:16px;margin-bottom:10px;">Shu lavozimga ariza yuborish</h3>
            ${applied ? `<div class="status-msg ok">✓ Siz allaqachon ariza yuborgansiz.</div>` : `
              <div class="file-row">
                <label style="font-size:13px;color:var(--muted);">Rezyume (PDF/DOC, ixtiyoriy):</label>
                <input type="file" id="resumeFile" accept=".pdf,.doc,.docx">
              </div>
              <div class="actions-row">
                <button class="btn btn-primary" id="applyBtn">Ariza yuborish</button>
                <a href="/" class="btn btn-ghost">Boshqa vakansiyalarni ko'rish</a>
              </div>
              <div class="status-msg" id="applyStatus"></div>
            `}
          </div>
          `}
        </div>
      `;

      const applyBtn = document.getElementById('applyBtn');
      if(applyBtn){
        applyBtn.addEventListener('click', async ()=>{
          if(!token){
            document.getElementById('applyStatus').textContent = "Ariza yuborish uchun avval bosh sahifada tizimga kiring.";
            document.getElementById('applyStatus').className = 'status-msg err';
            return;
          }
          applyBtn.disabled = true; applyBtn.textContent = 'Yuborilmoqda...';
          try{
            const fileInput = document.getElementById('resumeFile');
            const fd = new FormData();
            if(fileInput.files[0]) fd.append('resume', fileInput.files[0]);
            await api('/api/vacancies/' + v.id + '/apply', {method:'POST', body: fd});
            document.getElementById('applyStatus').textContent = "✓ Arizangiz yuborildi!";
            document.getElementById('applyStatus').className = 'status-msg ok';
            applyBtn.textContent = 'Yuborildi ✓';
          }catch(err){
            document.getElementById('applyStatus').textContent = err.message;
            document.getElementById('applyStatus').className = 'status-msg err';
            applyBtn.disabled = false; applyBtn.textContent = 'Ariza yuborish';
          }
        });
      }
    }catch(err){
      content.className = 'notfound';
      content.innerHTML = `<h2 style="margin-bottom:8px;">Vakansiya topilmadi</h2><p>${escapeHtml(err.message)}</p>`;
    }
  }

  load();
</script>
</body>
</html>
